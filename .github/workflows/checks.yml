name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    name: Internal links (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Offline mode: checks every relative/root-relative link, asset and
      # #fragment between pages. External URLs are skipped.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --root-dir ${{ github.workspace }}
            './**/*.html'

  api-tests:
    name: Form handler tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test 'tests/*.test.js'
